openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: study
    description: Study coach operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /profile:
    get:
      operationId: getProfile
      tags: [study]
      summary: Get the signed-in student's profile
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
    patch:
      operationId: updateProfile
      tags: [study]
      summary: Update the signed-in student's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
  /account:
    delete:
      operationId: deleteAccount
      tags: [study]
      summary: Permanently delete the signed-in student's account and all associated data
      responses:
        "204":
          description: Account deleted
  /tutor/conversation:
    get:
      operationId: getTutorConversation
      tags: [study]
      summary: Get the student's most recent tutor conversation
      parameters:
        - name: courseId
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Conversation history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationHistory"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [study]
      summary: Get the student's study dashboard
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /courses:
    get:
      operationId: listCourses
      tags: [study]
      summary: List study courses
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
    post:
      operationId: createCourse
      tags: [study]
      summary: Create a study course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseInput"
      responses:
        "201":
          description: Course created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
  /courses/{courseId}:
    patch:
      operationId: updateCourse
      tags: [study]
      summary: Update a course's details
      parameters:
        - name: courseId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseUpdateInput"
      responses:
        "200":
          description: Updated course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
  /courses/{courseId}/complete:
    post:
      operationId: completeCourse
      tags: [study]
      summary: Mark a course as completed and award a completion badge
      parameters:
        - name: courseId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Completed course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
  /courses/{courseId}/archive:
    post:
      operationId: archiveCourse
      tags: [study]
      summary: Archive a course
      parameters:
        - name: courseId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Archived course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
  /courses/{courseId}/reactivate:
    post:
      operationId: reactivateCourse
      tags: [study]
      summary: Reactivate a completed or archived course
      parameters:
        - name: courseId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Reactivated course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
  /courses/{courseId}/documents:
    get:
      operationId: listCourseDocuments
      tags: [study]
      summary: List documents attached to a course
      parameters:
        - name: courseId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentSummary"
  /documents/{documentId}:
    patch:
      operationId: updateDocument
      tags: [study]
      summary: Rename or reclassify a document
      parameters:
        - name: documentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentUpdateInput"
      responses:
        "200":
          description: Updated document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentSummary"
    delete:
      operationId: deleteDocument
      tags: [study]
      summary: Delete a document
      parameters:
        - name: documentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
  /documents/{documentId}/url:
    get:
      operationId: getDocumentUrl
      tags: [study]
      summary: Get a temporary download URL for a document
      parameters:
        - name: documentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Signed URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentUrl"
  /documents/{documentId}/extract:
    post:
      operationId: extractSyllabus
      tags: [study]
      summary: Extract topics and dates from a syllabus document
      parameters:
        - name: documentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Extraction result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyllabusExtraction"
  /documents/{documentId}/confirm-extraction:
    post:
      operationId: confirmExtraction
      tags: [study]
      summary: Confirm (possibly edited) syllabus extraction results and apply them
      parameters:
        - name: documentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyllabusExtraction"
      responses:
        "200":
          description: Applied extraction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractionApplyResult"
  /institutions/search:
    get:
      operationId: searchInstitutions
      tags: [study]
      summary: Search a public university/school dataset by name
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: countryCode
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Matching institutions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Institution"
  /events:
    get:
      operationId: listEvents
      tags: [study]
      summary: List upcoming course events, optionally scoped to one course
      parameters:
        - name: courseId
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CourseEvent"
    post:
      operationId: createEvent
      tags: [study]
      summary: Add a calendar event to a course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseEventInput"
      responses:
        "201":
          description: Event created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseEvent"
  /events/{eventId}:
    patch:
      operationId: updateEvent
      tags: [study]
      summary: Edit a calendar event
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseEventInput"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseEvent"
    delete:
      operationId: deleteEvent
      tags: [study]
      summary: Delete a calendar event
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
  /achievements:
    get:
      operationId: listAchievements
      tags: [study]
      summary: List the student's earned badges
      responses:
        "200":
          description: Achievements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Achievement"
  /tutor/messages:
    post:
      operationId: sendTutorMessage
      tags: [study]
      summary: Ask the AI tutor a question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TutorMessageInput"
      responses:
        "200":
          description: Tutor response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TutorMessage"
  /quiz:
    get:
      operationId: getQuiz
      tags: [study]
      summary: Get the current adaptive quiz
      responses:
        "200":
          description: Quiz question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizQuestion"
  /quiz/answers:
    post:
      operationId: submitQuizAnswer
      tags: [study]
      summary: Submit an answer and get feedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizAnswerInput"
      responses:
        "200":
          description: Answer feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizFeedback"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Profile:
      type: object
      required: [id, fullName, onboardingCompleted]
      properties:
        id: { type: string }
        fullName: { type: ["string", "null"] }
        firstName: { type: ["string", "null"] }
        lastName: { type: ["string", "null"] }
        gradeLevel: { type: ["string", "null"] }
        studyMinutesPerDay: { type: ["number", "null"] }
        learningStyle: { type: ["string", "null"] }
        country: { type: ["string", "null"] }
        countryCode: { type: ["string", "null"], description: "ISO 3166-1 alpha-2 code, set only via the country picker." }
        educationLevel: { type: ["string", "null"] }
        institutionName: { type: ["string", "null"] }
        institutionCountryCode: { type: ["string", "null"] }
        institutionWebsite: { type: ["string", "null"], description: "Official site URL — present only when the institution was selected from a lookup result, i.e. verified rather than freely typed." }
        institutionDomain: { type: ["string", "null"] }
        programMajor: { type: ["string", "null"] }
        degree: { type: ["string", "null"] }
        gradeYear: { type: ["string", "null"] }
        expectedCompletionDate: { type: ["string", "null"] }
        onboardingCompleted: { type: boolean }
        personalizationEnabled: { type: boolean }
    ProfileInput:
      type: object
      properties:
        fullName: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        gradeLevel: { type: string }
        studyMinutesPerDay: { type: number }
        learningStyle: { type: string }
        country: { type: string }
        countryCode: { type: ["string", "null"] }
        educationLevel: { type: string }
        institutionName: { type: string }
        institutionCountryCode: { type: ["string", "null"] }
        institutionWebsite: { type: ["string", "null"] }
        institutionDomain: { type: ["string", "null"] }
        programMajor: { type: string }
        degree: { type: string }
        gradeYear: { type: string }
        expectedCompletionDate: { type: string }
        onboardingCompleted: { type: boolean }
        personalizationEnabled: { type: boolean }
    Institution:
      type: object
      required: [name]
      properties:
        name: { type: string }
        countryCode: { type: ["string", "null"] }
        website: { type: ["string", "null"] }
        domain: { type: ["string", "null"] }
    ConversationMessage:
      type: object
      required: [role, message]
      properties:
        role: { type: string }
        message: { type: string }
    ConversationHistory:
      type: object
      required: [conversationId, messages]
      properties:
        conversationId: { type: ["string", "null"] }
        messages:
          type: array
          items: { $ref: "#/components/schemas/ConversationMessage" }
    CourseTopic:
      type: object
      required: [name, masteryLevel, masteryScore]
      properties:
        name: { type: string }
        masteryLevel: { type: string }
        masteryScore: { type: number }
    Course:
      type: object
      required: [id, name, completionDate, level, status, progress, topics]
      properties:
        id: { type: string }
        name: { type: string }
        completionDate: { type: ["string", "null"] }
        level: { type: string }
        status: { type: string }
        courseCode: { type: ["string", "null"] }
        institution: { type: ["string", "null"] }
        instructor: { type: ["string", "null"] }
        term: { type: ["string", "null"] }
        completedAt: { type: ["string", "null"] }
        progress: { type: number }
        topics:
          type: array
          items: { $ref: "#/components/schemas/CourseTopic" }
    CourseInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        completionDate: { type: string }
        level: { type: string }
        courseCode: { type: string }
        institution: { type: string }
        instructor: { type: string }
        term: { type: string }
    CourseUpdateInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        completionDate: { type: string }
        level: { type: string }
        courseCode: { type: string }
        institution: { type: string }
        instructor: { type: string }
        term: { type: string }
    StudyTask:
      type: object
      required: [label, duration, kind, completed]
      properties:
        label: { type: string }
        duration: { type: string }
        kind: { type: string }
        completed: { type: boolean }
    UpcomingEvent:
      type: object
      required: [id, courseName, type, title, eventDate]
      properties:
        id: { type: string }
        courseName: { type: string }
        type: { type: string }
        title: { type: string }
        eventDate: { type: string }
    Dashboard:
      type: object
      required: [greeting, courseName, courseProgress, strongestTopic, focusTopic, focusReason, tasks, xp, streak, questionsThisWeek, masteredTopics, upcomingEvents]
      properties:
        greeting: { type: string }
        courseName: { type: string }
        courseProgress: { type: number }
        strongestTopic: { type: string }
        focusTopic: { type: string }
        focusReason: { type: string }
        tasks:
          type: array
          items: { $ref: "#/components/schemas/StudyTask" }
        xp: { type: number }
        streak: { type: number }
        questionsThisWeek: { type: number }
        masteredTopics: { type: number }
        upcomingEvents:
          type: array
          items: { $ref: "#/components/schemas/UpcomingEvent" }
    TutorMessageInput:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1 }
        courseId: { type: ["string", "null"] }
        topicName: { type: ["string", "null"] }
        conversationId: { type: ["string", "null"] }
    TutorMessage:
      type: object
      required: [role, message, prompt, conversationId]
      properties:
        role: { type: string }
        message: { type: string }
        prompt: { type: string }
        conversationId: { type: string }
    QuizQuestion:
      type: object
      required: [id, number, total, topic, question, options, difficulty]
      properties:
        id: { type: string }
        number: { type: number }
        total: { type: number }
        topic: { type: string }
        question: { type: string }
        options:
          type: array
          items: { type: string }
        difficulty: { type: string }
    QuizAnswerInput:
      type: object
      required: [questionId, answer]
      properties:
        questionId: { type: string }
        answer: { type: string }
    QuizFeedback:
      type: object
      required: [correct, explanation, xp, nextTopic]
      properties:
        correct: { type: boolean }
        explanation: { type: string }
        xp: { type: number }
        nextTopic: { type: string }
    DocumentSummary:
      type: object
      required: [id, fileName, documentType, status, createdAt]
      properties:
        id: { type: string }
        fileName: { type: string }
        documentType: { type: string }
        status: { type: string }
        createdAt: { type: string }
        sizeBytes: { type: ["number", "null"] }
    DocumentUpdateInput:
      type: object
      properties:
        fileName: { type: string }
        documentType: { type: string }
    DocumentUrl:
      type: object
      required: [url]
      properties:
        url: { type: string }
    ExtractedTopic:
      type: object
      required: [name, confidence]
      properties:
        name: { type: string }
        confidence: { type: string }
    ExtractedEvent:
      type: object
      required: [type, title, eventDate, confidence]
      properties:
        type: { type: string }
        title: { type: string }
        eventDate: { type: ["string", "null"] }
        confidence: { type: string }
    SyllabusExtraction:
      type: object
      required: [confidence, courseName, courseCode, instructor, term, topics, events]
      properties:
        confidence: { type: string }
        courseName: { type: ["string", "null"] }
        courseCode: { type: ["string", "null"] }
        instructor: { type: ["string", "null"] }
        term: { type: ["string", "null"] }
        topics:
          type: array
          items: { $ref: "#/components/schemas/ExtractedTopic" }
        events:
          type: array
          items: { $ref: "#/components/schemas/ExtractedEvent" }
    ExtractionApplyResult:
      type: object
      required: [topicsCreated, eventsCreated]
      properties:
        topicsCreated: { type: number }
        eventsCreated: { type: number }
    CourseEvent:
      type: object
      required: [id, courseId, courseName, type, title, eventDate, source]
      properties:
        id: { type: string }
        courseId: { type: string }
        courseName: { type: string }
        type: { type: string }
        title: { type: string }
        eventDate: { type: string }
        description: { type: ["string", "null"] }
        source: { type: string }
    CourseEventInput:
      type: object
      required: [courseId, type, title, eventDate]
      properties:
        courseId: { type: string }
        type: { type: string }
        title: { type: string, minLength: 1 }
        eventDate: { type: string, minLength: 1 }
        description: { type: string }
    Achievement:
      type: object
      required: [id, key, title, description, courseName, courseCode, earnedAt]
      properties:
        id: { type: string }
        key: { type: string }
        title: { type: string }
        description: { type: ["string", "null"] }
        courseName: { type: ["string", "null"] }
        courseCode: { type: ["string", "null"] }
        earnedAt: { type: string }
        masteryAtCompletion: { type: ["number", "null"] }
