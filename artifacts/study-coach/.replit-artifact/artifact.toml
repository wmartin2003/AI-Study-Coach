kind = "web"
previewPath = "/"
title = "AI Study Coach"
description = "A personalized study workspace that turns course material into adaptive study plans, guided tutoring, quizzes, and targeted review for students."
version = "1.0.0"
id = "artifacts/study-coach"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22819

[services.development]
run = "pnpm --filter @workspace/study-coach run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/study-coach", "run", "build" ]
serve = "static"
publicDir = "artifacts/study-coach/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22819"
BASE_PATH = "/"
